<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iframe 示例 — 百度首页</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    header p {
      margin-top: 4px;
      font-size: 13px;
      color: #666;
    }

    main {
      flex: 1;
      padding: 16px;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 100px);
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>iframe 嵌入示例</h1>
    <p>下方 iframe 加载百度首页（https://www.baidu.com）</p>
  </header>

  <main>
    <iframe
      src="https://www.baidu.com"
      title="百度首页"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </main>
</body>
</html>
